  <text x="15" y="371" font-family="Arial,sans-serif" font-size="8" fill="#555">Carbohydrates: 72.4g</text>
  <text x="15" y="383" font-family="Arial,sans-serif" font-size="8" fill="#555">Protein: 7.6g | Fat: 14.0g</text>
  <text x="15" y="395" font-family="Arial,sans-serif" font-size="8" fill="#555">Sugar: 18g | Fibre: 1.4g</text>
