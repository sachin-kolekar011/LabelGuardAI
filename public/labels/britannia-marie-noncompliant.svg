  <rect x="10" y="330" width="200" height="95" fill="#F8F8F8" rx="3" stroke="#EEE" stroke-width="1"/>
  <text x="110" y="343" font-family="Arial,sans-serif" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">NUTRITION FACTS</text>
